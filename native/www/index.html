<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nacho OS</title>
    <!--
      Shown by Capacitor (`server.errorPath`) when the site can't be loaded, e.g. no signal.
      "Try again" goes back to the server URL, which Capacitor treats as the app's own origin.
    -->
    <style>
      html {
        background: #0085c8;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.5rem;
        padding: calc(env(safe-area-inset-top) + 2rem) calc(env(safe-area-inset-right) + 1.5rem)
          calc(env(safe-area-inset-bottom) + 2rem) calc(env(safe-area-inset-left) + 1.5rem);
        box-sizing: border-box;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 22px;
        line-height: 1.4;
        text-align: center;
        color: #fff;
        background: #0085c8;
        -webkit-text-size-adjust: 100%;
      }
      h1 {
        margin: 0;
        font-size: 36px;
        line-height: 1.2;
      }
      p {
        margin: 0;
      }
      .retry {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 64px;
        margin-top: 1rem;
        border-radius: 16px;
        background: #fff;
        color: #0085c8;
        font-size: 24px;
        font-weight: 700;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }
      .retry:active {
        background: #e0f0f9;
      }
    </style>
  </head>
  <body>
    <h1>No internet</h1>
    <p>Nacho OS needs an internet connection.</p>
    <p>Check Wi-Fi or mobile data, then tap Try again.</p>
    <a class="retry" id="retry" href="https://nacho-os.netlify.app">Try again</a>
    <script>
      // Show that something is happening; if it still fails Capacitor reloads this page.
      document.getElementById("retry").addEventListener("click", function () {
        this.textContent = "Connecting…";
      });
    </script>
  </body>
</html>
